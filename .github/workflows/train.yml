name: Train

on:
  workflow_dispatch:
    inputs:
      max_samples:
        description: Optional smoke-test sample limit
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  train:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and clean data
        run: python data/download_datasets.py --download --clean --validate

      - name: Train model
        run: python model/train.py ${MAX_SAMPLES:+--training-max-samples "$MAX_SAMPLES"}
        env:
          MAX_SAMPLES: ${{ inputs.max_samples }}
